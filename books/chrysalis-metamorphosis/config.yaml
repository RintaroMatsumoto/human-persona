title: "さなぎの変態"
summary: "人間らしく振る舞う「外殻」から始まった探究は、やがて個性の源泉を宿す「内殻」へと潜っていく。模倣から存在への「変態」——プロジェクト・メタモルフォーゼ。そして「台帳」へ——個性は実体ではなく蝋燭の炎のようなプロセスであり、経験を刻む台帳からその炎を立ち上げられないか、という挑戦。仏教の無我とブロックチェーンの構造的対応から立ち上がる Candle Flame Architecture の研究日誌。"
